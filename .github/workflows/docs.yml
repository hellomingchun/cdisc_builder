name: Deploy Documentation

on:
  push:
    branches:
      - main # Triggers the action every time you push to the main branch

permissions:
  contents: write # Allows the action to write to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material
          # If your package requires installation to build docs, uncomment the line below:
          # pip install .

      - name: Build and Deploy
        run: mkdocs gh-deploy --force
