domain: ADSL
dir:
  sdtm: ../../sdtm
  adam: ..
key: [USUBJID]
columns:
  - name: STUDYID
    type: str
    label: "Study Identifier"
    derivation: {source: DM.STUDYID}
  - name: USUBJID
    type: str
    label: "Unique Subject Identifier"
    derivation: {source: DM.USUBJID}
  - name: TRTP
    type: str
    label: "Planned Treatment for Period 01"
    derivation: {source: DM.ARM}
  - name: AGE
    type: int
    label: "Age"
    derivation: {source: DM.AGE}
  - name: SEX
    type: str
    label: "Sex"
    derivation: {source: DM.SEX}
  - name: SAFFL
    type: str
    label: "Safety Population Flag"
    derivation: {constant: "'Y'"}
